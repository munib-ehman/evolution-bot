# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "dcc254cec11e1d4056cea1b81bf02f18"
extension_directories = [ ]
name = "Evolution"
application_url = "https://www.runevolution.io/app"
embedded = true
handle = "runevolution"

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  uri = "https://www.runevolution.io/api/shopify-compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://www.runevolution.io/api/shopify-webhook"
  topics = [
  "app_subscriptions/update",
  "app/uninstalled",
  "orders/create"
]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_files,write_discounts,read_orders,write_orders,read_checkouts,read_customers,write_customers,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://www.runevolution.io/api/shopify-callback",
  "http://localhost:5173/api/shopify-callback"
]

[pos]
embedded = false
